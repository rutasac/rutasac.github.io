<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demuestra que eres andariego</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf6ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --papel:#faf6ea; --papel2:#f2ecda; --tinta:#3f342a; --suave:#6b5c4a;
    --marron:#56381f; --verde:#2f5a4e; --linea:#d9cdb4; --acento:#7d8f5c; --rojo:#9c4b32;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel:#1c1915; --papel2:#252019; --tinta:#efe6d4; --suave:#b9ab95;
      --marron:#d9b087; --verde:#8fc0ab; --linea:#3b342a; --acento:#9bb073; --rojo:#e09a80;
    }
  }
  :root[data-theme="dark"] {
    --papel:#1c1915; --papel2:#252019; --tinta:#efe6d4; --suave:#b9ab95;
    --marron:#d9b087; --verde:#8fc0ab; --linea:#3b342a; --acento:#9bb073; --rojo:#e09a80;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--papel); color:var(--tinta);
    font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
    font-size:19px; line-height:1.45; -webkit-text-size-adjust:100%;
  }
  .wrap { max-width:560px; margin:0 auto; padding:28px 20px 60px; }

  h1 { font-size:clamp(1.6rem,6.5vw,2.1rem); line-height:1.12; margin:0 0 4px; color:var(--marron); font-weight:800; }
  .sub { margin:0 0 26px; color:var(--suave); font-weight:600; font-size:.98rem; }

  .paso { display:none; }
  .paso.activo { display:block; }

  .pregunta { font-size:1.18rem; font-weight:700; color:var(--marron); margin:0 0 16px; }

  .opciones { display:flex; flex-direction:column; gap:10px; }
  .opciones button {
    font:inherit; font-weight:600; text-align:left;
    background:var(--papel2); color:var(--tinta);
    border:1px solid var(--linea); border-radius:14px;
    padding:15px 18px; cursor:pointer; line-height:1.3;
  }
  .opciones button:active { background:color-mix(in srgb,var(--acento) 18%,var(--papel2)); }
  .opciones button[disabled] { opacity:.5; }

  .grande {
    display:inline-flex; align-items:center; gap:10px;
    font:inherit; font-weight:700; font-size:1.1rem;
    background:var(--verde); color:var(--papel);
    border:0; border-radius:99px; padding:16px 28px; cursor:pointer;
  }
  .centro { text-align:center; }

  .aviso { border-radius:14px; padding:14px 16px; margin:16px 0 0; font-size:.95rem; }
  .aviso.mal  { background:color-mix(in srgb,var(--rojo) 14%,transparent); color:var(--rojo); font-weight:600; }
  .aviso.bien { background:color-mix(in srgb,var(--acento) 16%,transparent); color:var(--acento); font-weight:600; }

  .previa { margin:18px 0 0; }
  .previa img { display:block; width:100%; border-radius:14px; border:1px solid var(--linea); }

  .nota { color:var(--suave); font-size:.88rem; margin-top:22px; }
  footer { margin-top:30px; text-align:center; font-size:.85rem; color:var(--suave); }
  footer a { color:var(--verde); }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Demuestra que eres andariego</h1>
  <p class="sub">Responde y sube el cartel de la próxima ruta.</p>

  <!-- 1. la pregunta -->
  <section class="paso activo" id="paso-pregunta">
    <p class="pregunta" id="pregunta">Cargando la pregunta…</p>
    <div class="opciones" id="opciones"></div>
    <div id="fallo"></div>
  </section>

  <!-- 2. la foto -->
  <section class="paso" id="paso-foto">
    <div class="aviso bien">Correcto. Ya puedes subir el cartel.</div>
    <p class="centro" style="margin-top:22px">
      <button class="grande" id="elegir">Elegir la foto</button>
    </p>
    <input type="file" id="archivo" accept="image/*">
    <div class="previa" id="previa"></div>
    <p class="centro" id="zona-enviar" style="display:none">
      <button class="grande" id="enviar">Subir el cartel</button>
    </p>
    <p class="nota">La foto se ve en la web en unos minutos. Si subes otra más tarde, se queda la última.</p>
  </section>

  <!-- 3. resultado -->
  <section class="paso" id="paso-fin">
    <div class="aviso bien" id="fin-texto"></div>
    <p class="centro" style="margin-top:24px">
      <a class="grande" href="./" style="text-decoration:none">Ver la web de las rutas</a>
    </p>
  </section>

  <footer>Andariegos Coseranos</footer>
</div>

<script>
(function () {
  // Dirección del programa que recibe los carteles.
  var SERVICIO = 'https://script.google.com/macros/s/AKfycbz547WqRvdhTlfNJRQCzcSu4YbGl7SgapUXRnadME0tKP8LPLjIzjvMSAcr40rmfeCI/exec';

  var $ = function (id) { return document.getElementById(id); };
  var pase = null, imagenBase64 = null;

  function mostrar(cual) {
    ['paso-pregunta', 'paso-foto', 'paso-fin'].forEach(function (p) {
      $(p).classList.toggle('activo', p === cual);
    });
    window.scrollTo(0, 0);
  }

  function enviar(datos) {
    // sin cabeceras propias: así el navegador no pide permiso previo
    return fetch(SERVICIO, { method: 'POST', body: JSON.stringify(datos) })
      .then(function (r) { return r.json(); });
  }

  // ---- 1. pedir una pregunta al azar
  function pedirPregunta() {
    fetch(SERVICIO)
      .then(function (r) { return r.json(); })
      .then(function (p) {
        if (p.error === 'cerrado') {
          $('pregunta').textContent = 'Demasiados intentos fallidos. Prueba dentro de un rato.';
          return;
        }
        $('pregunta').textContent = p.texto;
        var caja = $('opciones');
        caja.innerHTML = '';
        p.opciones.forEach(function (op) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = op;
          b.addEventListener('click', function () { contestar(p.id, op, caja); });
          caja.appendChild(b);
        });
      })
      .catch(function (err) {
        $('pregunta').textContent = 'No se ha podido cargar la pregunta. Revisa la conexión y vuelve a entrar.';
        $('fallo').innerHTML = '<div class="aviso mal" style="font-size:.8rem">Detalle técnico: ' +
          String(err && err.message ? err.message : err) + '</div>';
      });
  }

  function contestar(id, respuesta, caja) {
    Array.prototype.forEach.call(caja.children, function (b) { b.disabled = true; });
    enviar({ accion: 'comprobar', id: id, respuesta: respuesta })
      .then(function (r) {
        if (r.ok) { pase = r.pase; mostrar('paso-foto'); return; }
        $('fallo').innerHTML = '<div class="aviso mal">Esa no es. Te saco otra pregunta.</div>';
        setTimeout(function () { $('fallo').innerHTML = ''; pedirPregunta(); }, 1600);
      })
      .catch(function () {
        $('fallo').innerHTML = '<div class="aviso mal">No se ha podido comprobar. Inténtalo otra vez.</div>';
        Array.prototype.forEach.call(caja.children, function (b) { b.disabled = false; });
      });
  }

  // ---- 2. elegir y encoger la foto
  $('elegir').addEventListener('click', function () { $('archivo').click(); });

  $('archivo').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var lector = new FileReader();
    lector.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1400;
        var escala = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * escala);
        c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var datos = c.toDataURL('image/jpeg', 0.85);
        imagenBase64 = datos.split(',')[1];
        $('previa').innerHTML = '<img alt="Cartel elegido" src="' + datos + '">';
        $('zona-enviar').style.display = 'block';
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(f);
  });

  // ---- 3. subir
  $('enviar').addEventListener('click', function () {
    if (!imagenBase64) return;
    var b = this;
    b.disabled = true;
    b.textContent = 'Subiendo…';
    enviar({ accion: 'subir', pase: pase, imagen: imagenBase64 })
      .then(function (r) {
        if (r.ok) {
          $('fin-texto').textContent = '¡Listo! El cartel saldrá en la web en unos minutos.';
          mostrar('paso-fin');
          return;
        }
        b.disabled = false;
        b.textContent = 'Subir el cartel';
        var m = r.error === 'pase'   ? 'Ha pasado mucho rato. Vuelve a entrar y responde otra vez.'
              : r.error === 'limite' ? 'Hoy ya se han subido muchos carteles. Prueba mañana.'
              : 'No se ha podido subir. Inténtalo de nuevo.';
        alert(m);
      })
      .catch(function () {
        b.disabled = false;
        b.textContent = 'Subir el cartel';
        alert('No se ha podido subir. Revisa la conexión.');
      });
  });

  pedirPregunta();
})();
</script>
</body>
</html>
